<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forgot Passcode | SwiftPurse Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#fff;min-height:100vh;color:#19202F}
.wrap{max-width:420px;margin:0 auto;padding:1.25rem 1.5rem 2rem;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem}
.back{font-size:1.35rem;background:none;border:none;cursor:pointer}
.sign-in{border:1px solid #ddd;border-radius:999px;padding:.45rem 1.1rem;font-size:.9rem;text-decoration:none;color:#19202F;font-weight:500}
h1{font-size:1.35rem;font-weight:700;margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem}
.sub{color:#6b7280;font-size:.9rem;margin-bottom:1.5rem;line-height:1.45}
.field input{width:100%;padding:.9rem 1rem;border:1px solid #e5e7eb;border-radius:999px;font-size:.95rem;outline:none;margin-bottom:1rem}
.field input:focus{border-color:#3498db}
.btn{width:100%;padding:.95rem;border:none;border-radius:999px;font-size:1rem;font-weight:600;cursor:pointer;background:#19202F;color:#fff}
.btn:disabled{opacity:.6}
.hint{text-align:center;color:#6b7280;font-size:.85rem;margin-top:1.25rem}
.hint a{color:#3498db}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);padding:.75rem 1.1rem;border-radius:10px;font-size:.9rem;z-index:9999;display:none}
.toast.error{background:#dc2626;color:#fff}.toast.success{background:#16a34a;color:#fff}.toast.show{display:block}
.footer{margin-top:auto;padding-top:2rem;text-align:center;color:#9ca3af;font-size:.8rem}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='login.html'">←</button>
    <a class="sign-in" href="login.html">Sign In</a>
  </div>
  <h1>Forgot Passcode? 🔒</h1>
  <p class="sub">Enter the email address with your account and we'll send an email with confirmation to reset your passcode.</p>
  <form id="form">
    <div class="field"><input type="email" id="email" placeholder="Email Address" required></div>
    <button type="submit" class="btn" id="btn">Reset Passcode</button>
  </form>
  <div class="hint">Haven't gotten the mail yet? <a href="mailto:support@swiftpursebank.com">Mail Us</a></div>
  <div class="footer">Copyright © 2026 All rights reserved.</div>
</div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  function toast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.className = 'toast ' + (type || 'error') + ' show';
    setTimeout(function () { el.classList.remove('show'); }, 4500);
  }
  document.getElementById('form').onsubmit = async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    if (!email) { toast('Enter your email'); return; }
    var btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      await SwiftPurse.api('/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email: email })
      });
      toast('Reset Code Sent Successfully. Check your Email.', 'success');
    } catch (err) {
      toast((err.data && err.data.message) || err.message || 'Request failed');
    }
    btn.disabled = false; btn.textContent = 'Reset Passcode';
  };
})();
</script>

</html>
