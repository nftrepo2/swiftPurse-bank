<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fff">
  <title>App - SwiftPurse Bank</title>
  <link rel="icon" type="image/svg+xml" href="https://swiftpursebank.com/wp-api/site/t_8e130165f44db81d6468a6473e71287e.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f7f7f7}</style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-gray-100">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../login.html" class="text-sm text-gray-600 hover:text-gray-900 flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Back
      </a>
      <a href="../login.html" class="text-sm font-medium text-slate-800">Sign In</a>
    </div>
  </header>

  <main class="flex-1 flex items-start justify-center p-4 pt-10">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="mx-auto mb-4 w-14 h-14 rounded-full bg-slate-900 flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="text-xl font-semibold text-gray-900">Create New Transfer PIN</h1>
        <p class="text-sm text-gray-500 mt-2">This Transfer PIN should be different from your previous PIN</p>
      </div>
      <div id="errorBox" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></div>
      <div id="okBox" class="hidden mb-4 text-sm text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2"></div>
      <form id="resetPinForm" class="space-y-4">
        <input type="hidden" id="token" name="token">
        <input type="hidden" id="email" name="email">
        <div>
          <input id="newPin" name="new_pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required placeholder="Create PIN (4 digits)" class="w-full bg-gray-100 border-0 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
        </div>
        <div>
          <input id="confirmPin" name="confirm_pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required placeholder="Confirm PIN" class="w-full bg-gray-100 border-0 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-medium text-sm hover:bg-slate-800">Continue</button>
      </form>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script>
  (function(){
    var params=new URLSearchParams(location.search);
    document.getElementById('token').value=params.get('token')||'';
    document.getElementById('email').value=params.get('email')||'';
    if(!params.get('token')){
      document.getElementById('errorBox').textContent='Invalid or missing reset link.';
      document.getElementById('errorBox').classList.remove('hidden');
      document.getElementById('btnSubmit').disabled=true;
    }
    document.getElementById('resetPinForm').onsubmit=async function(e){
      e.preventDefault();
      var pin=document.getElementById('newPin').value.trim();
      var conf=document.getElementById('confirmPin').value.trim();
      var err=document.getElementById('errorBox');
      var ok=document.getElementById('okBox');
      err.classList.add('hidden'); ok.classList.add('hidden');
      if(!/^\d{4}$/.test(pin)){err.textContent='PIN must be 4 digits';err.classList.remove('hidden');return;}
      if(pin!==conf){err.textContent='PINs do not match';err.classList.remove('hidden');return;}
      var btn=document.getElementById('btnSubmit');
      btn.disabled=true; btn.textContent='Saving…';
      try{
        var res=await api.post('/user/reset-pin',{
          token:document.getElementById('token').value,
          email:document.getElementById('email').value,
          pin:pin,
          confirm_pin:conf
        });
        ok.textContent=(res.data&&res.data.message)||'PIN reset successfully';
        ok.classList.remove('hidden');
        setTimeout(function(){ location.href='../login.html'; }, 1200);
      }catch(ex){
        err.textContent=(ex.data&&ex.data.message)||ex.message||'Reset failed';
        err.classList.remove('hidden');
        btn.disabled=false; btn.textContent='Continue';
      }
    };
  })();
  </script>
</body>
</html>
