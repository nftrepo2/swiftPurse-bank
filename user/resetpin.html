<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fff">
  <title>App - SwiftPurse Bank</title>
  <link rel="icon" type="image/svg+xml" href="https://swiftpursebank.com/wp-api/site/t_8e130165f44db81d6468a6473e71287e.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f7f7f7}</style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-gray-100">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../login.html" class="text-sm text-gray-600 hover:text-gray-900 flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Back
      </a>
      <a href="../login.html" class="text-sm font-medium text-slate-800">Sign In</a>
    </div>
  </header>

  <main class="flex-1 flex items-start justify-center p-4 pt-10">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="mx-auto mb-4 w-14 h-14 rounded-full bg-slate-900 flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="text-xl font-semibold text-gray-900">Create New Transfer PIN</h1>
        <p class="text-sm text-gray-500 mt-2">This Transfer PIN should be different from your previous PIN</p>
      </div>
      <div id="errorBox" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></div>
      <div id="okBox" class="hidden mb-4 text-sm text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2"></div>
      <form id="resetPinForm" class="space-y-4">
        <input type="hidden" id="token" name="token">
        <input type="hidden" id="email" name="email">
        <div>
          <input id="newPin" name="new_pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required placeholder="Create PIN (4 digits)" class="w-full bg-gray-100 border-0 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
        </div>
        <div>
          <input id="confirmPin" name="confirm_pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required placeholder="Confirm PIN" class="w-full bg-gray-100 border-0 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-medium text-sm hover:bg-slate-800">Continue</button>
      </form>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script>
  (function(){
    var params=new URLSearchParams(location.search);
    document.getElementById('token').value=params.get('token')||'';
    document.getElementById('email').value=params.get('email')||'';
    if(!params.get('token')){
      document.getElementById('errorBox').textContent='Invalid or missing reset link.';
      document.getElementById('errorBox').classList.remove('hidden');
      document.getElementById('btnSubmit').disabled=true;
    }
    document.getElementById('resetPinForm').onsubmit=async function(e){
      e.preventDefault();
      var pin=document.getElementById('newPin').value.trim();
      var conf=document.getElementById('confirmPin').value.trim();
      var err=document.getElementById('errorBox');
      var ok=document.getElementById('okBox');
      err.classList.add('hidden'); ok.classList.add('hidden');
      if(!/^\d{4}$/.test(pin)){err.textContent='PIN must be 4 digits';err.classList.remove('hidden');return;}
      if(pin!==conf){err.textContent='PINs do not match';err.classList.remove('hidden');return;}
      var btn=document.getElementById('btnSubmit');
      btn.disabled=true; btn.textContent='Saving…';
      try{
        var res=await api.post('/user/reset-pin',{
          token:document.getElementById('token').value,
          email:document.getElementById('email').value,
          pin:pin,
          confirm_pin:conf
        });
        ok.textContent=(res.data&&res.data.message)||'PIN reset successfully';
        ok.classList.remove('hidden');
        setTimeout(function(){ location.href='../login.html'; }, 1200);
      }catch(ex){
        err.textContent=(ex.data&&ex.data.message)||ex.message||'Reset failed';
        err.classList.remove('hidden');
        btn.disabled=false; btn.textContent='Continue';
      }
    };
  })();
  </script>

<script>
(function(){
  function parseTier(t){
    var s = String(t == null ? '' : t).trim();
    if (!s) return 1;
    if (/tier\s*2/i.test(s) || s === '2') return 2;
    if (/tier\s*1/i.test(s) || s === '1') return 1;
    var m = s.match(/(\d+)/);
    return m ? parseInt(m[1], 10) : 1;
  }
  function applyUserShell(me){
    if (!me) return 1;
    if (me.user) me = me.user;
    var name = me.name || [me.first_name, me.last_name].filter(Boolean).join(' ') || 'User';
    var tierLabel = me.account_tier || me.tier || 'Tier 1';
    document.querySelectorAll('.userDisplayName').forEach(function(el){ el.textContent = name; });
    document.querySelectorAll('.userTier').forEach(function(el){ el.textContent = tierLabel; });
    if (me.image) {
      document.querySelectorAll('#headerAvatar, #menuAvatar').forEach(function(img){ if (img) img.src = me.image; });
    }
    return parseTier(tierLabel);
  }
  function showGateModal(){
    var existing = document.getElementById('tierGateModal');
    if (existing) existing.remove();
    var box = document.createElement('div');
    box.id = 'tierGateModal';
    box.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4';
    box.innerHTML = '<div class="absolute inset-0 bg-black/40" data-close></div>' +
      '<div class="relative bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center">' +
      '<div class="mx-auto w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-2xl mb-3">⚠</div>' +
      '<div class="font-semibold text-gray-900 mb-1">Access restricted</div>' +
      '<p class="text-sm text-gray-600 mb-4">Not available for your region. Upgrade to have access.</p>' +
      '<a href="upgrade.html" class="inline-block bg-slate-900 text-white text-sm px-4 py-2 rounded-xl">Upgrade Account</a>' +
      '<button type="button" data-close class="block w-full mt-3 text-sm text-gray-500">Close</button></div>';
    document.body.appendChild(box);
    box.addEventListener('click', function(e){ if (e.target.hasAttribute('data-close')) box.remove(); });
  }
  async function enforceTierGates(){
    var tier = 1;
    try {
      var res = await api.get('/auth/me');
      tier = applyUserShell(res.data || {});
    } catch (e) {
      try {
        var res2 = await api.get('/user/dashboard');
        var data = res2.data || {};
        tier = applyUserShell(data.user || data);
      } catch (_) {}
    }
    document.querySelectorAll('a[data-tier-gate]').forEach(function(a){
      a.addEventListener('click', function(ev){
        var need = parseInt(a.getAttribute('data-tier-gate') || '2', 10);
        if (tier < need) {
          ev.preventDefault();
          showGateModal();
        }
      });
    });
    var path = (location.pathname || '').toLowerCase();
    var gated = /(credit-card|apply-card|loan\.html|loans-details)/.test(path);
    if (/\/apply\.html$/.test(path) || path.indexOf('/user/apply.html') >= 0) gated = true;
    if (gated && tier < 2) {
      var main = document.querySelector('main');
      if (main) {
        main.innerHTML = '<div class="bg-white rounded-2xl border border-amber-100 p-8 text-center max-w-md mx-auto mt-8">' +
          '<div class="mx-auto w-14 h-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-3xl mb-3">⚠</div>' +
          '<div class="text-lg font-semibold text-gray-900 mb-2">Not available for your region</div>' +
          '<p class="text-sm text-gray-600 mb-4">Upgrade to Tier 2 to have access to this feature.</p>' +
          '<a href="upgrade.html" class="inline-block bg-slate-900 text-white text-sm px-5 py-2.5 rounded-xl">Upgrade Account</a></div>';
      }
    }
  }
  document.addEventListener('DOMContentLoaded', function(){ enforceTierGates(); });
})();
</script>


<script>
(function(){
  async function refreshNotifBadge(){
    try {
      var res = await api.get('/user/dashboard/notifications/unread');
      var data = res.data || {};
      var count = data.unreadCount != null ? data.unreadCount : (data.count != null ? data.count : 0);
      if (count === 0 && Array.isArray(data.notifications)) {
        count = data.notifications.filter(function(n){ return !n.read_at; }).length;
      }
      document.querySelectorAll('#notifBadge').forEach(function(badge){
        if (count > 0) {
          badge.textContent = count > 99 ? '99+' : String(count);
          badge.classList.remove('hidden');
        } else {
          badge.textContent = '0';
          badge.classList.add('hidden');
        }
      });
    } catch (e) {
      // fallback dashboard
      try {
        var res2 = await api.get('/user/dashboard');
        var c = (res2.data && res2.data.unreadCount) || 0;
        document.querySelectorAll('#notifBadge').forEach(function(badge){
          if (c > 0) { badge.textContent = c > 99 ? '99+' : String(c); badge.classList.remove('hidden'); }
          else { badge.classList.add('hidden'); }
        });
      } catch (_) {}
    }
  }
  document.addEventListener('DOMContentLoaded', function(){ refreshNotifBadge(); });
  window.refreshNotifBadge = refreshNotifBadge;
})();
</script>
